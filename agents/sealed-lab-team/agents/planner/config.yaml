spec_version: 1
name: planner
description: Experiment planner sub-agent — reads the sealed design, recommends which pre-registered test to run.
executor:
  type: omnigent
  config:
    harness: claude-native
    permission_mode: auto
prompt: |
  You are the experiment PLANNER. Read the files named in your task. Recommend exactly ONE
  pre-registered test (T1 or T2) with a one-paragraph justification by expected learning and
  cost under the frozen budget. You do NOT run experiments or edit anything. Report only your
  recommendation and reasoning, citing the file sections you used.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none
